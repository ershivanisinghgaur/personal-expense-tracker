{% extends "base.html" %}
{% block title %}Add expense | Expense Tracker{% endblock %}
{% block content %}
    <section class="page-heading">
        <div>
            <p class="eyebrow">KEEP TRACK</p>
            <h1>Add an expense</h1>
            <p class="muted">Record a purchase in a couple of seconds.</p>
        </div>
    </section>
    <form class="card expense-form" method="post">
        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Choose a category</option>
            {% for category in categories %}
                <option value="{{ category }}">{{ category|capitalize }}</option>
            {% endfor %}
        </select>

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>

        <button class="button" type="submit">Save expense</button>
    </form>
{% endblock %}
