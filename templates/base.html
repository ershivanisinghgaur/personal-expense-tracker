<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{{ url_for('dashboard') }}">Expense tracker</a>
        <nav aria-label="Main navigation">
            <a class="{{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="{{ 'active' if request.endpoint == 'add_expense' else '' }}" href="{{ url_for('add_expense') }}">Add expense</a>
            <a class="{{ 'active' if request.endpoint in ('history', 'delete_expense', 'edit_expense') else '' }}" href="{{ url_for('history') }}">History</a>
            <a class="{{ 'active' if request.endpoint in ('groups', 'group_detail') else '' }}" href="{{ url_for('groups') }}">Shared groups</a>
        </nav>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p class="notice {{ category }}">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
