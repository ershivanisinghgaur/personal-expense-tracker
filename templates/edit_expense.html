{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <section class="page-heading">
        <div>
            <p class="eyebrow">KEEP TRACK</p>
            <h1>{{ heading }}</h1>
            <p class="muted">Update the category, amount, or date for this expense.</p>
        </div>
    </section>
    <form class="card expense-form" method="post" action="{{ form_action }}">
        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="" disabled {% if not values.get('category') %}selected{% endif %}>Choose a category</option>
            {% for category in categories %}
                <option value="{{ category }}" {% if values.get('category') == category %}selected{% endif %}>{{ category|capitalize }}</option>
            {% endfor %}
        </select>

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" value="{{ values.get('amount', '') }}" required>

        <label for="date">Date</label>
        <input id="date" name="date" type="date" value="{{ values.get('date', '') }}" required>

        <button class="button" type="submit">{{ submit_label }}</button>
        <a class="cancel-link" href="{{ url_for('history') }}">Cancel</a>
    </form>
{% endblock %}
